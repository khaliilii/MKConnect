name: MKConnect CI/CD

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write # needed to create releases

env:
  BUILD_TAGS: with_gvisor,with_quic,with_utls

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        # pipefail keeps the exit code of go through `| tee`; report() turns the
        # log tail into an annotation so failures are readable without log access.
        shell: bash -o pipefail -e {0}
    env:
      BASH_ENV: .github/report.sh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install GUI build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev wayland-protocols

      - name: Vet
        run: go vet -tags "$BUILD_TAGS" ./... 2>&1 | tee vet.log || { report vet.log; exit 1; }

      - name: Test
        run: go test -race -tags "$BUILD_TAGS" ./... 2>&1 | tee test.log || { report test.log; exit 1; }

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: "386" }
          - { goos: linux, goarch: arm, goarm: "7" }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: windows, goarch: "386" }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: android, goarch: arm64 }

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          name="MKConnect-${GOOS}-${GOARCH}${GOARM:+v$GOARM}"
          if [ "$GOOS" = "windows" ]; then name="$name.exe"; fi
          version="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then version="dev-${GITHUB_SHA::7}"; fi
          go build -trimpath -tags "$BUILD_TAGS" \
            -ldflags "-s -w -X github.com/khaliilii/MKConnect/internal/version.Version=${version}" \
            -o "dist/$name" .
          ls -lh dist/

      - uses: actions/upload-artifact@v5
        with:
          name: MKConnect-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }}
          path: dist/*

  gui:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, name: linux-amd64 }
          - { runner: ubuntu-24.04-arm, name: linux-arm64 }
          - { runner: macos-latest, name: macos-universal }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Version
        run: |
          v="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then v="dev-${GITHUB_SHA::7}"; fi
          echo "LDVERSION=-X github.com/khaliilii/MKConnect/internal/version.Version=$v" >> "$GITHUB_ENV"

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev wayland-protocols

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          go build -trimpath -tags "$BUILD_TAGS" -ldflags "-s -w $LDVERSION" -o dist/MKConnect ./cmd/mkconnect-gui
          cp cmd/mkconnect-gui/Icon.png dist/
          tar -C dist -czf "MKConnect-GUI-${{ matrix.name }}.tar.gz" MKConnect Icon.png

      - name: Build (macOS universal .app)
        if: runner.os == 'macOS'
        run: |
          export CGO_ENABLED=1
          GOARCH=arm64 go build -trimpath -tags "$BUILD_TAGS" -ldflags "-s -w $LDVERSION" -o dist/mk-arm64 ./cmd/mkconnect-gui
          GOARCH=amd64 CGO_CFLAGS="-arch x86_64" CGO_LDFLAGS="-arch x86_64" \
            go build -trimpath -tags "$BUILD_TAGS" -ldflags "-s -w $LDVERSION" -o dist/mk-amd64 ./cmd/mkconnect-gui

          app=dist/MKConnect.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create -output "$app/Contents/MacOS/MKConnect" dist/mk-arm64 dist/mk-amd64

          iconset=dist/MKConnect.iconset
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            sips -z $size $size cmd/mkconnect-gui/Icon.png --out "$iconset/icon_${size}x${size}.png" >/dev/null
            sips -z $((size*2)) $((size*2)) cmd/mkconnect-gui/Icon.png --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/MKConnect.icns"

          version="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then version="0.0.0"; fi
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>MKConnect</string>
            <key>CFBundleDisplayName</key><string>MKConnect</string>
            <key>CFBundleIdentifier</key><string>com.khaliilii.mkconnect</string>
            <key>CFBundleExecutable</key><string>MKConnect</string>
            <key>CFBundleIconFile</key><string>MKConnect.icns</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>CFBundleVersion</key><string>${version}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          codesign --force --deep --sign - "$app"
          ditto -c -k --keepParent "$app" "MKConnect-GUI-${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v5
        with:
          name: MKConnect-GUI-${{ matrix.name }}
          path: MKConnect-GUI-*

  # Windows builds natively for every architecture with MSYS2's C toolchains
  # (the Windows runner images no longer ship MinGW).
  gui-windows:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, arch: amd64, msystem: MINGW64, cc: mingw-w64-x86_64-gcc }
          - { runner: windows-latest, arch: "386", msystem: MINGW32, cc: mingw-w64-i686-gcc }
          - { runner: windows-11-arm, arch: arm64, msystem: CLANGARM64, cc: mingw-w64-clang-aarch64-clang }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          path-type: inherit # keep the Go from setup-go on PATH
          install: ${{ matrix.cc }} zip

      - name: Build
        run: |
          v="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then v="dev-${GITHUB_SHA::7}"; fi
          export CGO_ENABLED=1 GOARCH=${{ matrix.arch }}
          if [ "${{ matrix.arch }}" = arm64 ]; then export CC=clang; else export CC=gcc; fi
          go version
          go build -trimpath -tags "$BUILD_TAGS" \
            -ldflags "-s -w -H=windowsgui -X github.com/khaliilii/MKConnect/internal/version.Version=$v" \
            -o dist/MKConnect.exe ./cmd/mkconnect-gui
          cd dist && zip -9 "../MKConnect-GUI-windows-${{ matrix.arch }}.zip" MKConnect.exe

      - uses: actions/upload-artifact@v5
        with:
          name: MKConnect-GUI-windows-${{ matrix.arch }}
          path: MKConnect-GUI-*

  # Targets without a native runner or C toolchain are cross-compiled in
  # fyne-cross's Docker images (Linux 386/armv7, Android).
  gui-cross:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -o pipefail -e {0}
    env:
      BASH_ENV: .github/report.sh
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: "386" }
          - { os: linux, arch: arm }
          - { os: android, arch: arm64 }
          - { os: android, arch: arm }
          - { os: android, arch: amd64 }
          - { os: android, arch: "386" }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install fyne-cross
        run: go install github.com/fyne-io/fyne-cross@latest

      # The images ship an older Go. Put this Go's toolchain into fyne-cross's
      # cache (mounted as /go) so the container doesn't download it mid-build:
      # the "go: downloading" message breaks `fyne package`'s metadata step.
      - name: Pre-fetch Go toolchain for the container
        run: |
          gv=$(go env GOVERSION)
          echo "CONTAINER_GO=$gv" >> "$GITHUB_ENV"
          GOTOOLCHAIN=local GOFLAGS=-modcacherw GOMODCACHE="$HOME/.cache/fyne-cross/pkg/mod" \
            go mod download golang.org/toolchain@v0.0.1-$gv.linux-amd64

      - name: Build
        run: |
          v="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then v="dev-${GITHUB_SHA::7}"; fi
          # `fyne package` overrides -ldflags, so the app also gets the version as
          # metadata (x.y.z; the About dialog falls back to it).
          appv="${GITHUB_REF_NAME#v}"; appv="${appv%%-*}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then appv="0.0.${GITHUB_RUN_NUMBER}"; fi
          # fyne-cross splits -ldflags on spaces, so -X must use the -X=name=value form.
          fyne-cross ${{ matrix.os }} -arch=${{ matrix.arch }} \
            -tags "$BUILD_TAGS" \
            -ldflags "-X=github.com/khaliilii/MKConnect/internal/version.Version=$v" \
            -env GOTOOLCHAIN="$CONTAINER_GO" \
            -app-id com.khaliilii.mkconnect -name MKConnect \
            -app-version "$appv" -app-build "${GITHUB_RUN_NUMBER}" \
            -icon cmd/mkconnect-gui/Icon.png \
            ./cmd/mkconnect-gui 2>&1 | tee build.log || { report build.log; exit 1; }
          ls -lR fyne-cross/dist

      - name: Rename
        run: |
          for f in fyne-cross/dist/*/*; do
            case "$f" in
              *.tar.xz) ext=tar.xz ;;
              *) ext="${f##*.}" ;;
            esac
            cp "$f" "MKConnect-GUI-${{ matrix.os }}-${{ matrix.arch }}.$ext"
          done
          ls -lh MKConnect-GUI-*

      - uses: actions/upload-artifact@v5
        with:
          name: MKConnect-GUI-${{ matrix.os }}-${{ matrix.arch }}
          path: MKConnect-GUI-*

  release:
    needs: [build, gui, gui-windows, gui-cross]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist/
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum MKConnect-* > SHA256SUMS && cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MKConnect-*
            dist/SHA256SUMS
          generate_release_notes: true
          # v1.2.3-beta.1 and similar are marked as pre-releases
          prerelease: ${{ contains(github.ref_name, '-') }}
