name: MKConnect CI/CD

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write # needed to create releases

env:
  BUILD_TAGS: with_gvisor,with_quic,with_utls

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet -tags "$BUILD_TAGS" ./...

      - name: Test
        run: go test -race -tags "$BUILD_TAGS" ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: "386" }
          - { goos: linux, goarch: arm, goarm: "7" }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: windows, goarch: "386" }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: android, goarch: arm64 }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          name="MKConnect-${GOOS}-${GOARCH}${GOARM:+v$GOARM}"
          if [ "$GOOS" = "windows" ]; then name="$name.exe"; fi
          version="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then version="dev-${GITHUB_SHA::7}"; fi
          go build -trimpath -tags "$BUILD_TAGS" \
            -ldflags "-s -w -X github.com/khaliilii/MKConnect/internal/cli.Version=${version}" \
            -o "dist/$name" .
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: MKConnect-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum MKConnect-* > SHA256SUMS && cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MKConnect-*
            dist/SHA256SUMS
          generate_release_notes: true
