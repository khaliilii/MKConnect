name: MKConnect CI/CD

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write # needed to create releases

env:
  BUILD_TAGS: with_gvisor,with_quic,with_utls

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        # pipefail keeps the exit code of go through `| tee`; report() turns the
        # log tail into an annotation so failures are readable without log access.
        shell: bash -o pipefail -e {0}
    env:
      BASH_ENV: .github/report.sh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install GUI build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev wayland-protocols

      - name: Vet
        run: go vet -tags "$BUILD_TAGS" ./... 2>&1 | tee vet.log || { report vet.log; exit 1; }

      - name: Test
        run: go test -race -tags "$BUILD_TAGS" ./... 2>&1 | tee test.log || { report test.log; exit 1; }

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: "386" }
          - { goos: linux, goarch: arm, goarm: "7" }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: windows, goarch: "386" }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: android, goarch: arm64 }

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          name="MKConnect-${GOOS}-${GOARCH}${GOARM:+v$GOARM}"
          if [ "$GOOS" = "windows" ]; then name="$name.exe"; fi
          version="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then version="dev-${GITHUB_SHA::7}"; fi
          go build -trimpath -tags "$BUILD_TAGS" \
            -ldflags "-s -w -X github.com/khaliilii/MKConnect/internal/version.Version=${version}" \
            -o "dist/$name" .
          ls -lh dist/

      - uses: actions/upload-artifact@v5
        with:
          name: MKConnect-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }}
          path: dist/*

  gui:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, name: linux-amd64 }
          - { runner: ubuntu-24.04-arm, name: linux-arm64 }
          - { runner: windows-latest, name: windows-amd64 }
          - { runner: macos-latest, name: macos-universal }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Version
        run: |
          v="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then v="dev-${GITHUB_SHA::7}"; fi
          echo "LDVERSION=-X github.com/khaliilii/MKConnect/internal/version.Version=$v" >> "$GITHUB_ENV"

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev wayland-protocols

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          go build -trimpath -tags "$BUILD_TAGS" -ldflags "-s -w $LDVERSION" -o dist/MKConnect ./cmd/mkconnect-gui
          cp cmd/mkconnect-gui/Icon.png dist/
          tar -C dist -czf "MKConnect-GUI-${{ matrix.name }}.tar.gz" MKConnect Icon.png

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          go build -trimpath -tags "$BUILD_TAGS" -ldflags "-s -w -H=windowsgui $LDVERSION" -o dist/MKConnect.exe ./cmd/mkconnect-gui
          cd dist && 7z a "../MKConnect-GUI-${{ matrix.name }}.zip" MKConnect.exe

      - name: Build (macOS universal .app)
        if: runner.os == 'macOS'
        run: |
          export CGO_ENABLED=1
          GOARCH=arm64 go build -trimpath -tags "$BUILD_TAGS" -ldflags "-s -w $LDVERSION" -o dist/mk-arm64 ./cmd/mkconnect-gui
          GOARCH=amd64 CGO_CFLAGS="-arch x86_64" CGO_LDFLAGS="-arch x86_64" \
            go build -trimpath -tags "$BUILD_TAGS" -ldflags "-s -w $LDVERSION" -o dist/mk-amd64 ./cmd/mkconnect-gui

          app=dist/MKConnect.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create -output "$app/Contents/MacOS/MKConnect" dist/mk-arm64 dist/mk-amd64

          iconset=dist/MKConnect.iconset
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            sips -z $size $size cmd/mkconnect-gui/Icon.png --out "$iconset/icon_${size}x${size}.png" >/dev/null
            sips -z $((size*2)) $((size*2)) cmd/mkconnect-gui/Icon.png --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/MKConnect.icns"

          version="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then version="0.0.0"; fi
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>MKConnect</string>
            <key>CFBundleDisplayName</key><string>MKConnect</string>
            <key>CFBundleIdentifier</key><string>com.khaliilii.mkconnect</string>
            <key>CFBundleExecutable</key><string>MKConnect</string>
            <key>CFBundleIconFile</key><string>MKConnect.icns</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>CFBundleVersion</key><string>${version}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          codesign --force --deep --sign - "$app"
          ditto -c -k --keepParent "$app" "MKConnect-GUI-${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v5
        with:
          name: MKConnect-GUI-${{ matrix.name }}
          path: MKConnect-GUI-*

  # Targets without a native runner or C toolchain are cross-compiled in
  # fyne-cross's Docker images (Linux 386/armv7, Windows 386/arm64, Android).
  gui-cross:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -o pipefail -e {0}
    env:
      BASH_ENV: .github/report.sh
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: "386" }
          - { os: linux, arch: arm }
          - { os: windows, arch: "386" }
          - { os: windows, arch: arm64 }
          - { os: android, arch: arm64 }
          - { os: android, arch: arm }
          - { os: android, arch: amd64 }
          - { os: android, arch: "386" }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install fyne-cross
        run: go install github.com/fyne-io/fyne-cross@latest

      - name: Build
        run: |
          v="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then v="dev-${GITHUB_SHA::7}"; fi
          # The images ship an older Go; GOTOOLCHAIN=auto fetches the one go.mod asks for.
          fyne-cross ${{ matrix.os }} -arch=${{ matrix.arch }} \
            -tags "$BUILD_TAGS" \
            -ldflags "-X github.com/khaliilii/MKConnect/internal/version.Version=$v" \
            -env GOTOOLCHAIN=auto \
            -app-id com.khaliilii.mkconnect -name MKConnect \
            -icon cmd/mkconnect-gui/Icon.png \
            ./cmd/mkconnect-gui 2>&1 | tee build.log || { report build.log; exit 1; }
          ls -lR fyne-cross/dist

      - name: Rename
        run: |
          for f in fyne-cross/dist/*/*; do
            case "$f" in
              *.tar.xz) ext=tar.xz ;;
              *) ext="${f##*.}" ;;
            esac
            cp "$f" "MKConnect-GUI-${{ matrix.os }}-${{ matrix.arch }}.$ext"
          done
          ls -lh MKConnect-GUI-*

      - uses: actions/upload-artifact@v5
        with:
          name: MKConnect-GUI-${{ matrix.os }}-${{ matrix.arch }}
          path: MKConnect-GUI-*

  release:
    needs: [build, gui, gui-cross]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist/
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum MKConnect-* > SHA256SUMS && cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MKConnect-*
            dist/SHA256SUMS
          generate_release_notes: true
